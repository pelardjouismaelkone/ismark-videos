name: Programmation Zernio (IG + FB)
on:
  push:
    branches: [main]
    paths: ['publisher/schedule.json']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publisher
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Envoyer le planning à Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: node publisher/zernio-sync.mjs
      - name: Enregistrer le suivi
        if: always()
        run: |
          git config user.name "ismark-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add publisher/state.json
          git diff --cached --quiet || (git commit -m "Suivi des publications" && git pull --rebase -q && git push)
